<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

<div id='container' class="container bg-info bg-opacity-10 border border-info rounded">
    <h2 class='text-info-emphasis text-center'>To Do list</h2>

    <div class="input-group mb-3">
        <input type="text" id='task-input' class="form-control" placeholder="add your task" aria-label="add your task" aria-describedby="button-addon2">
        <button class="btn btn-info text-info-emphasis" type="button" id="addTask">Add</button>
    </div>

    <div id="todo-items" class="mb-3"></div>
</div>

<template id="todo-item">
    <div class="input-group mb-3 todo-item">
        <div class="input-group-text">
            <input class="form-check-input mt-0 flag" type="checkbox" value="" aria-label="Checkbox for following text input">
        </div>
        <input type="text" class="form-control" aria-label="Text input with checkbox">
        <div class="input-group-text">
            <button class="btn btn-danger btn-sm delete-btn" type="button">x</button>
        </div>
    </div>
</template>


<script type="module" src="./js/MVC/Controller.js"></script>
<script type="module" src="./js/MVC/View.js"></script>
<script type="module" src="./js/MVC/Model.js"></script>

</body>
</html>
