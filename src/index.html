<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
<div id='container' class="container">
    <h2 class='text-primary text-center'>Your To Do list</h2>

    <div class="input-group mb-3">
        <input type="text" id='task-input' class="form-control" placeholder="add your task" aria-label="add your task" aria-describedby="button-addon2">
        <button class="btn btn-info" type="button" id="addTask">Add</button>
    </div>

    <div class="input-group mb-3">
        <div class="input-group-text">
            <input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input">
        </div>
        <input type="text" class="form-control" aria-label="Text input with checkbox">
        <div class="input-group-text">
            <button class="btn btn-danger btn-sm" type="button" id="button">x</button>
        </div>
    </div>

</div>

<script src="./js/script.js"></script>
<script id="todo-item" type="template">
    <div class="input-group mb-3">
        <div class="input-group-text">
            <input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input">
        </div>
        <input type="text" class="form-control" aria-label="Text input with checkbox">
        <div class="input-group-text">
            <button class="btn btn-danger btn-sm" type="button">x</button>
        </div>
    </div>
</script>
</body>
</html>
